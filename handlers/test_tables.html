<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test AJAX Tabel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h2>Test AJAX Tabel PostgreSQL</h2>
        
        <div class="card">
            <div class="card-body">
                <div class="mb-3">
                    <label for="db_host" class="form-label">Host Database</label>
                    <input type="text" class="form-control" id="db_host" value="localhost">
                </div>
                
                <div class="mb-3">
                    <label for="db_port" class="form-label">Port</label>
                    <input type="text" class="form-control" id="db_port" value="5432">
                </div>
                
                <div class="mb-3">
                    <label for="db_user" class="form-label">Username</label>
                    <input type="text" class="form-control" id="db_user" value="postgres">
                </div>
                
                <div class="mb-3">
                    <label for="db_pass" class="form-label">Password</label>
                    <input type="password" class="form-control" id="db_pass">
                </div>
                
                <div class="mb-3">
                    <label for="database" class="form-label">Database</label>
                    <input type="text" class="form-control" id="database">
                </div>
                
                <div class="d-grid">
                    <button type="button" class="btn btn-primary" id="testSimpleAjax">Test Simple AJAX</button>
                    <div class="mt-2"></div>
                    <button type="button" class="btn btn-success" id="testGetTables">Ambil Daftar Tabel</button>
                </div>
            </div>
        </div>
        
        <div class="mt-3" id="loading" style="display:none;">
            <div class="d-flex align-items-center">
                <div class="spinner-border text-primary me-2" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <span>Memproses...</span>
            </div>
        </div>
        
        <div class="mt-3">
            <div class="card">
                <div class="card-header">Hasil</div>
                <div class="card-body">
                    <pre id="result">Hasil akan muncul di sini...</pre>
                </div>
            </div>
        </div>
        
        <div class="mt-3" id="tables_container" style="display:none;">
            <div class="card">
                <div class="card-header">Daftar Tabel</div>
                <div class="card-body" id="tables_result">
                </div>
            </div>
        </div>
    </div>
    
    <script>
    $(document).ready(function() {
        // Test Simple AJAX
        $('#testSimpleAjax').click(function() {
            $('#loading').show();
            $('#result').text('Mengirim request...');
            
            $.ajax({
                url: 'test_ajax.php',
                type: 'GET',
                dataType: 'json',
                success: function(response) {
                    $('#loading').hide();
                    $('#result').text(JSON.stringify(response, null, 2));
                },
                error: function(xhr, status, error) {
                    $('#loading').hide();
                    $('#result').text('Error: ' + error + '\n\nResponse: ' + xhr.responseText);
                }
            });
        });
        
        // Test Get Tables
        $('#testGetTables').click(function() {
            $('#loading').show();
            $('#result').text('Mengirim request untuk mendapatkan tabel...');
            $('#tables_container').hide();
            
            var db_host = $('#db_host').val();
            var db_port = $('#db_port').val();
            var db_user = $('#db_user').val();
            var db_pass = $('#db_pass').val();
            var db_name = $('#database').val();
            
            $.ajax({
                url: 'get_tables_ajax.php',
                type: 'POST',
                dataType: 'json',
                data: {
                    db_host: db_host,
                    db_port: db_port,
                    db_user: db_user,
                    db_pass: db_pass,
                    database: db_name
                },
                success: function(response) {
                    $('#loading').hide();
                    $('#result').text(JSON.stringify(response, null, 2));
                    
                    if (response.success) {
                        $('#tables_container').show();
                        $('#tables_result').html(response.html);
                    }
                },
                error: function(xhr, status, error) {
                    $('#loading').hide();
                    $('#result').text('Error: ' + error + '\n\nResponse: ' + xhr.responseText);
                }
            });
        });
    });
    </script>
</body>
</html>
